name: Feature request
description: Suggest an idea or a new notification target
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Routing and matching, Destinations, Web UI, API, Security and sign-in, Docker and deployment, Other]
    validations:
      required: true
