# Keeps a draft release up to date from merged PRs and labels PRs from their title, branch and files.
name: Release Drafter

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: release-drafter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  autolabel:
    name: Label the pull request
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Get a nerdy-intern token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.NERDY_INTERN_APP_ID }}
          private-key: ${{ secrets.NERDY_INTERN_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write
          permission-contents: read
      # pull_request_target: nothing from the PR is checked out or run here.
      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-name: release-drafter.yml

  draft:
    name: Update the draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Get a nerdy-intern token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.NERDY_INTERN_APP_ID }}
          private-key: ${{ secrets.NERDY_INTERN_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-name: release-drafter.yml
