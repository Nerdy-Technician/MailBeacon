name-template: "MailBeacon v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
exclude-labels: [skip-changelog]
categories:
  - title: "Breaking changes"
    labels: [breaking]
  - title: "Security"
    labels: [security]
  - title: "Features"
    labels: [feature, enhancement]
  - title: "Fixes"
    labels: [fix, bug]
  - title: "Performance"
    labels: [performance]
  - title: "Documentation"
    labels: [documentation]
  - title: "Dependencies"
    collapse-after: 5
    labels: [dependencies]
  - title: "Maintenance"
    labels: [chore, ci, refactor, test, build]
version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [fix, bug, security, performance, documentation, dependencies, chore, ci, refactor, test, build]
  default: patch
autolabeler:
  - label: breaking
    title: ['/^[a-z]+(\(.+\))?!:/']
  - label: feature
    title: ['/^feat(\(.+\))?!?:/i']
    branch: ['/^feat(ure)?\//i']
  - label: fix
    title: ['/^fix(\(.+\))?!?:/i']
    branch: ['/^(fix|bug)\//i']
  - label: security
    title: ['/^(sec|security)(\(.+\))?!?:/i']
  - label: performance
    title: ['/^perf(\(.+\))?!?:/i']
  - label: documentation
    title: ['/^docs(\(.+\))?!?:/i']
    files: ["*.md", "docs/**"]
  - label: ci
    title: ['/^ci(\(.+\))?!?:/i']
    files: [".github/**"]
  - label: dependencies
    title: ['/^(deps|build\(deps(-dev)?\))/i']
    files: ["package-lock.json"]
  - label: test
    title: ['/^test(\(.+\))?!?:/i']
    files: ["test/**"]
  - label: refactor
    title: ['/^refactor(\(.+\))?!?:/i']
  - label: chore
    title: ['/^(chore|style)(\(.+\))?!?:/i']
  - label: build
    title: ['/^build(\(.+\))?!?:/i']
    files: ["Dockerfile", "docker-compose.yml", "docker-entrypoint.sh"]
  - label: ui
    files: ["public/**"]
template: |
  ## Changes

  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
