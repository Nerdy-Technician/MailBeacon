services:
  mailbeacon:
    image: ghcr.io/nerdy-technician/mailbeacon:latest
    # Uncomment to build from this checkout instead of pulling the published image:
    # build: .
    container_name: mailbeacon
    restart: unless-stopped
    env_file: .env
    ports:
      - "2525:2525"   # SMTP
      - "8080:8080"   # Web UI
    volumes:
      - ./data:/data
    # Same check as the image's HEALTHCHECK: SMTP listener and database only (?core=1), so a down
    # notification service never marks the container unhealthy. Monitor /healthz (no ?core) for that.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.MAILBEACON_WEB_PORT||8080)+'/healthz?core=1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
